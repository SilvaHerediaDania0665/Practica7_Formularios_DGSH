<!DOCTYPE html> <!--Indica la versión de HTML que se usará-->
<html lang="en"> <!--Configura el idioma de la página-->

	<head> <!--Abre el encabezado de la página-->
		<meta charset="UTF-8"> <!--Permite usar caracteres especiales-->
		<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Ajusta la página a cualquier pantalla-->
		<title>Formularios en HTML</title> <!--Título de la pestaña de la página-->

		<!-- Libreria de iconos en linea -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
	</head> <!--Cierra el encabezado-->

	<body> <!--Abre el cuerpo de la página-->
		<h2>Formulario con limitaciones</h2> <!--Título grande-->
		<form action="" method="post"> <!--Crea un formulario-->
			Ingresa tu nombre: <!--Texto-->
			<!-- Desahbilitacion de campo -->
			<input type="text" name="nombre" disabled><br> <!--Permite ingresar datos y hace un salto de línea-->
			<!-- Limitacion de caracteres -->
			Contraseña: <!--Texto-->
			<input type="password" name="pass" maxlength="5"><br> <!--Permite ingresar datos y hace un salto de línea-->
			<!-- Solo lectura -->
			Comentarios: <!--Texto-->
			<textarea name="comentarios" readonly> <!--Crea un cuadro de texto-->
				Este es mi comentario y no se puede borrar  <!--Texto-->
			</textarea><br>  <!--Cierra el cuadro de texto y hace un salto de línea-->
		</form> <!--Cierra el formulario-->
	</body> <!--Cierra el cuerpo de la página-->
</html> <!--Cierra todo el documento HTML-->
