<!DOCTYPE html> <!--Indica la versión de HTML que se usará-->
<html lang="en"> <!--Configura el idioma de la página-->

	<head> <!--Abre el encabezado de la página-->
		<meta charset="UTF-8"> <!--Permite usar caracteres especiales-->
		<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Ajusta la página a cualquier pantalla-->
		<title>Formularios en HTML</title> <!--Título de la pestaña de la página-->

		<!-- Libreria de iconos en linea -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
	</head> <!--Cierra el encabezado-->

	<body> <!--Abre el cuerpo de la página-->
		<h2>Formularios con Radioboton</h2> <!--Título grande-->
		<form action="" method="post">
			Ingresa tu nombre:
			<input type="text" name="nombre">
			<br> <!--Salto de línea-->
			Selecciona el maximo de estudios que tienes: <!--Texto-->
			<br> <!--Salto de línea-->

			<!--Opciones para elegir con salto de línea-->
			<input type="radio" name="estudios" value="1">Sin estudios <br> 
			<input type="radio" name="estudios" value="2">Primaria <br>
			<input type="radio" name="estudios" value="3">Secundaria <br>
			<input type="radio" name="estudios" value="4">Preparatoria <br>
			<input type="submit" value="enviar"> <!--Crea un botón -->
			<input type="reset" value="borrar"> <!--Crea un botón-->
		</form> <!--Cierra el formulario-->
	</body> <!--Cierra el cuerpo de la página-->
</html> <!--Cierra todo el documento HTML-->
